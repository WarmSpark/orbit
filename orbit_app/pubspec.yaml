name: orbit_app
description: "ORBIT — a privacy-first campus hangout app (fresh UI)."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State
  provider: ^6.1.2

  # Networking
  http: ^1.2.2
  web_socket_channel: ^3.0.1

  # Local storage (auth token + cached profile)
  shared_preferences: ^2.3.2

  # Auth
  google_sign_in: ^6.2.2

  # Map (OpenStreetMap — no API key required)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Location
  geolocator: ^13.0.2
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/orbit_logo.png
